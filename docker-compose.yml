# Usage:
#   Build images (once, or after code changes):
#     docker compose build
#   Run (seeds DB on first start):
#     docker compose up                            # realistic (default, adversarial data)
#     SEED_MODE=clean docker compose up             # clean (no adversarial data)
#   Reset to seed state:
#     docker compose down && docker compose up      # containers start fresh, re-seed

x-service-base: &service-base
  environment: &base-env
    JWT_SECRET: dev-secret
    SEED_MODE: ${SEED_MODE:-realistic}

services:
  ams:
    <<: *service-base
    build:
      context: .
      dockerfile: services/ams/Dockerfile
    image: evergreen/ams:latest
    ports:
      - "3000:3000"
    environment:
      <<: *base-env
      PORT: 3000
      SERVICE_NAME: ams
    healthcheck:
      test: ["CMD", "bun", "run", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  rater:
    <<: *service-base
    build:
      context: .
