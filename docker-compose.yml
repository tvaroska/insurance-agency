services:
  ams:
    build:
      context: .
      dockerfile: services/ams/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=dev-secret
    healthcheck:
      test: ["CMD", "bun", "run", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  rater:
    build:
      context: .
      dockerfile: services/rater/Dockerfile
    ports:
