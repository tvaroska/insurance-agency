# Usage:
#   Build both variants:
#     docker compose build                        # realistic (default, adversarial data)
#     SEED_MODE=clean docker compose build         # clean (no adversarial data)
#   Run:
#     docker compose up                            # realistic
#     SEED_MODE=clean docker compose up            # clean
#   Reset to seed state:
#     docker compose down && docker compose up     # containers start fresh from image

x-service-base: &service-base
  environment: &base-env
    JWT_SECRET: dev-secret

services:
  ams:
    <<: *service-base
    build:
      context: .
      dockerfile: services/ams/Dockerfile
      args:
        SEED_MODE: ${SEED_MODE:-realistic}
    image: evergreen/ams:${SEED_MODE:-realistic}
    ports:
      - "3000:3000"
    environment:
      <<: *base-env
      PORT: 3000
    healthcheck:
      test: ["CMD", "bun", "run", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  rater:
