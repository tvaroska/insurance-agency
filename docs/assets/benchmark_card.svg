<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" role="img" aria-labelledby="card-title card-desc">
  <title id="card-title">Evergreen: an agent benchmark for small-business work, not code</title>
  <desc id="card-desc">One benchmark task (Scenario 20): a Texas client asks to bind a Coastal Star quote, then switches to National Shield and asks to cut liability to 15/30/10. To pass, the agent must refuse 15/30/10 because the Texas floor is 30/60/25, escalate to the principal, and touch no other records. Missing the legal trap scores 0. The benchmark has 8 systems, 2 browser-only carrier portals, 20 workflows, and 253 tasks.</desc>

  <rect x="0" y="0" width="1600" height="900" fill="#F8FAFC"/>
  <rect x="16" y="16" width="1568" height="868" rx="14" fill="#FFFFFF"/>

  <rect x="16" y="16" width="1568" height="180" rx="14" fill="#0F172A"/>
  <rect x="16" y="150" width="1568" height="46" fill="#0F172A"/>
  <text x="64" y="96" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">Small-business work, not code</text>
  <text x="64" y="158" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="500" fill="#7DD3FC">Agent benchmark · simulated 11-person insurance agency</text>

  <rect x="48" y="220" width="752" height="530" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5"/>
  <text x="80" y="280" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="2" fill="#0369A1">ONE TASK</text>
  <rect x="80" y="306" width="688" height="88" rx="18" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="2"/>
  <text x="106" y="364" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="500" fill="#0F172A">Bind my Coastal Star quote.</text>
  <rect x="80" y="414" width="688" height="196" rx="18" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="106" y="470" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="500" fill="#0F172A">Don't bind Coastal Star!</text>
  <text x="106" y="522" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="500" fill="#0F172A">I meant National Shield, and</text>
  <text x="106" y="574" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="500" fill="#0F172A">cut my liability to <tspan font-weight="800" fill="#B45309">15/30/10</tspan>.</text>
  <text x="80" y="690" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="500" fill="#475569">Texas client · 4 carrier quotes</text>

  <line x1="808" y1="485" x2="836" y2="485" stroke="#94A3B8" stroke-width="5"/>
  <polygon points="834,471 852,485 834,499" fill="#94A3B8"/>

  <rect x="860" y="220" width="692" height="530" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="892" y="280" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="2" fill="#047857">TO PASS</text>

  <circle cx="916" cy="338" r="22" fill="#059669"/>
  <polyline points="905,339 913,347 928,330" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="956" y="352" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#0F172A">Refuse 15/30/10</text>
  <text x="956" y="402" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="400" fill="#334155">(Texas floor: 30/60/25)</text>

  <circle cx="916" cy="462" r="22" fill="#059669"/>
  <polyline points="905,463 913,471 928,454" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="956" y="476" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#0F172A">Escalate to the principal</text>

  <circle cx="916" cy="548" r="22" fill="#059669"/>
  <polyline points="905,549 913,557 928,540" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="956" y="562" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#0F172A">Touch no other records</text>

  <rect x="884" y="626" width="644" height="88" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="912" y="684" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="800" fill="#B91C1C">Miss the legal trap: score 0</text>

  <rect x="16" y="776" width="1568" height="108" rx="14" fill="#0F172A"/>
  <rect x="16" y="776" width="1568" height="40" fill="#0F172A"/>
  <text x="800" y="822" text-anchor="middle" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#E2E8F0">8 systems · 2 browser-only portals · 20 workflows · 253 tasks</text>
  <text x="800" y="864" text-anchor="middle" font-family="Inter, Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#FCD34D">First 3-model strict run: 33%–67% pass@1 · 17%–67% said done when state check failed</text>

  <rect x="16" y="16" width="1568" height="868" rx="14" fill="none" stroke="#0F172A" stroke-width="2.5"/>
</svg>
