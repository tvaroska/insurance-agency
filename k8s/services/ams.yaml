apiVersion: apps/v1
kind: Deployment
metadata:
  name: ams
  labels:
    app: ams
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ams
  template:
    metadata:
      labels:
        app: ams
        app.kubernetes.io/part-of: evergreen-insurance
    spec:
      containers:
        - name: ams
          image: evergreen/ams:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: evergreen-config
          env:
            - name: PORT
              value: "3000"
            - name: SERVICE_NAME
              value: "ams"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: DATABASE_URL_AMS
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ams
  labels:
    app: ams
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  type: ClusterIP
  selector:
    app: ams
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
