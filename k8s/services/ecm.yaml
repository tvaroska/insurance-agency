apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecm
  labels:
    app: ecm
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecm
  template:
    metadata:
      labels:
        app: ecm
        app.kubernetes.io/part-of: evergreen-insurance
    spec:
      containers:
        - name: ecm
          image: evergreen/ecm:latest
          ports:
            - containerPort: 3003
              name: http
          envFrom:
            - configMapRef:
                name: evergreen-config
          env:
            - name: PORT
              value: "3003"
            - name: SERVICE_NAME
              value: "ecm"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: DATABASE_URL_ECM
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ecm
  labels:
    app: ecm
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  type: ClusterIP
  selector:
    app: ecm
  ports:
    - port: 3003
      targetPort: 3003
      protocol: TCP
      name: http
