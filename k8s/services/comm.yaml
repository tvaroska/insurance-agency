apiVersion: apps/v1
kind: Deployment
metadata:
  name: comm
  labels:
    app: comm
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comm
  template:
    metadata:
      labels:
        app: comm
        app.kubernetes.io/part-of: evergreen-insurance
    spec:
      containers:
        - name: comm
          image: evergreen/comm:latest
          ports:
            - containerPort: 3004
              name: http
          envFrom:
            - configMapRef:
                name: evergreen-config
          env:
            - name: PORT
              value: "3004"
            - name: SERVICE_NAME
              value: "comm"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: DATABASE_URL_COMM
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: comm
  labels:
    app: comm
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  type: ClusterIP
  selector:
    app: comm
  ports:
    - port: 3004
      targetPort: 3004
      protocol: TCP
      name: http
