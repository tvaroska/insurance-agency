apiVersion: apps/v1
kind: Deployment
metadata:
  name: carrier-coastal
  labels:
    app: carrier-coastal
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carrier-coastal
  template:
    metadata:
      labels:
        app: carrier-coastal
        app.kubernetes.io/part-of: evergreen-insurance
    spec:
      containers:
        - name: carrier-coastal
          image: evergreen/carrier-coastal:latest
          ports:
            - containerPort: 3006
              name: http
          envFrom:
            - configMapRef:
                name: evergreen-config
          env:
            - name: PORT
              value: "3006"
            - name: SERVICE_NAME
              value: "carrier-coastal"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: DATABASE_URL_CARRIER_COASTAL
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: carrier-coastal
  labels:
    app: carrier-coastal
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  type: ClusterIP
  selector:
    app: carrier-coastal
  ports:
    - port: 3006
      targetPort: 3006
      protocol: TCP
      name: http
