apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm
  labels:
    app: crm
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm
  template:
    metadata:
      labels:
        app: crm
        app.kubernetes.io/part-of: evergreen-insurance
    spec:
      containers:
        - name: crm
          image: evergreen/crm:latest
          ports:
            - containerPort: 3002
              name: http
          envFrom:
            - configMapRef:
                name: evergreen-config
          env:
            - name: PORT
              value: "3002"
            - name: SERVICE_NAME
              value: "crm"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: DATABASE_URL_CRM
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: crm
  labels:
    app: crm
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  type: ClusterIP
  selector:
    app: crm
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
      name: http
