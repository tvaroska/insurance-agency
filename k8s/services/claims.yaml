apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims
  labels:
    app: claims
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims
  template:
    metadata:
      labels:
        app: claims
        app.kubernetes.io/part-of: evergreen-insurance
    spec:
      containers:
        - name: claims
          image: evergreen/claims:latest
          ports:
            - containerPort: 3007
              name: http
          envFrom:
            - configMapRef:
                name: evergreen-config
          env:
            - name: PORT
              value: "3007"
            - name: SERVICE_NAME
              value: "claims"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: DATABASE_URL_CLAIMS
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: claims
  labels:
    app: claims
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  type: ClusterIP
  selector:
    app: claims
  ports:
    - port: 3007
      targetPort: 3007
      protocol: TCP
      name: http
