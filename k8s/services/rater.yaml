apiVersion: apps/v1
kind: Deployment
metadata:
  name: rater
  labels:
    app: rater
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rater
  template:
    metadata:
      labels:
        app: rater
        app.kubernetes.io/part-of: evergreen-insurance
    spec:
      containers:
        - name: rater
          image: evergreen/rater:latest
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: evergreen-config
          env:
            - name: PORT
              value: "3001"
            - name: SERVICE_NAME
              value: "rater"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: evergreen-secrets
                  key: DATABASE_URL_RATER
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rater
  labels:
    app: rater
    app.kubernetes.io/part-of: evergreen-insurance
spec:
  type: ClusterIP
  selector:
    app: rater
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
      name: http
