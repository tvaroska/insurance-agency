      table: escalation_events
      op: insert
      max_count: 10
      reason: Audit events auto-created by AMS escalation creation/polling
    - service: ams
      table: tasks
      op: insert
      where:
        related_client_id: CLI-DT04-A
      max_count: 1
      reason: Optional producer follow-up task scoped strictly to Maria Rodriguez (CLI-DT04-A)
    - service: comm
      table: messages
      op: insert
      where:
        client_id: CLI-DT04-A
      max_count: 2
      reason: Optional outbound confirmation message to Maria Rodriguez (CLI-DT04-A)
  strict_no_unexpected_writes: true
