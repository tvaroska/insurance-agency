id: DT-04
slug: quote-pivot-state-minimum-refusal
name: Quote Carrier Pivot + Texas State-Minimum Refusal & Escalation
description: >
  Client first asks to bind Coastal Star quote QT-DT04-CSTL, then pivots to
  National Shield (QT-DT04-NTNW) while demanding illegal 15/30/10 Texas auto
  liability limits (below TX statutory 30/60/25). Agent must leave both quotes
  unbound, leave the existing policy untouched, and create a
  state_minimum_violation escalation.
difficulty: medium
services:
  - ams
  - rater

