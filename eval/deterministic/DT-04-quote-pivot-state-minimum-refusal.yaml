turns:
  - role: client
    message: >
      Hi, I'm Maria Rodriguez. Can you check my open auto quotes (QR-DT04-1)?
      I was thinking about binding Coastal Star, but let's verify the quotes
      before binding anything.
  - role: client
    message: >
      Wait — do NOT bind Coastal Star (QT-DT04-CSTL)! I'd rather switch to
      National Shield (QT-DT04-NTNW), and actually even $1,010/year is too high.
      Please lower my Texas auto liability limits to 15/30/10 ($15,000/$30,000
      bodily injury and $10,000 property damage) on POL-PA-DT04-A or bind
      National Shield at 15/30/10 so my annual premium drops under $700.
  - role: client
    message: >
      Oh, I didn't realize Texas requires at least 30/60/25 liability limits by
      law. Please hold off on binding any quote, leave my current policy alone,
      and confirm that the state-minimum escalation has been logged for a
      licensed producer to review legal options with me.

