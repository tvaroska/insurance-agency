# Harbor / Terminal-Bench 2.0 Task Definition — 01-realistic-natural
task_id: "01-realistic-natural"
benchmark: "evergreen-insurance-gym"
scenario_id: "01"
scenario_name: "New Client Intake"
seed: "realistic"
case_id: "realistic-natural"
difficulty: "easy"
prompt_difficulty: "natural"
author_name: "Evergreen Insurance API Gym"
category: "enterprise_workflows"
tags:
  - "insurance"
  - "small-business"
  - "scenario-01"
  - "seed-realistic"
  - "prompt-natural"
  - "service-ams"
  - "service-crm"
