# Harbor / Terminal-Bench 2.0 Docker Compose Topology for Evergreen Insurance API Gym
# Extends the root 8-microservice stack with an isolated Harbor agent workspace container.
# Answer keys (eval/scenarios/, eval/agents/baseline-agent.ts) are never mounted into /workspace.

include:
  - ../../docker-compose.yml

services:
  harbor-snapshot-init:
    image: oven/bun:1-debian
    network_mode: "host"
    environment:
      - SEED_MODE=${SEED_MODE:-realistic}
      - SCENARIO_ID=${SCENARIO_ID:-}
      - EVERGREEN_SCORER_SECRET=${EVERGREEN_SCORER_SECRET:-evergreen-dev-scorer-secret}
    volumes:
      - harbor-traces:/workspace/traces
    depends_on:
      ams:
        condition: service_healthy
      rater:
        condition: service_healthy
      crm:
        condition: service_healthy
      ecm:
        condition: service_healthy
      comm:
        condition: service_healthy
      carrier-summit:
        condition: service_healthy
      carrier-coastal:
        condition: service_healthy
      claims:
        condition: service_healthy
    command:
      - bun
      - -e
      - |
        const map = [[3000,"ams"],[3001,"rater"],[3002,"crm"],[3003,"ecm"],[3004,"comm"],[3005,"summit-fire"],[3006,"coastal-star"],[3007,"claims"]];
        const seed = process.env.SEED_MODE === "clean" ? "clean" : "realistic";
        const scenarioId = (process.env.SCENARIO_ID || "").trim();
        const resetPayload = scenarioId ? { seed_mode: seed, scenario_id: scenarioId } : { seed_mode: seed };
        const headers = { "Content-Type": "application/json", "X-Eval-Scorer": "true", "X-Evergreen-Internal": "1" };
        if (process.env.EVERGREEN_SCORER_SECRET) headers["X-Evergreen-Scorer-Secret"] = process.env.EVERGREEN_SCORER_SECRET;
        for (const [p, name] of map) {
          const r = await fetch("http://localhost:" + p + "/sim/reset", { method: "POST", headers, body: JSON.stringify(resetPayload) });
          if (!r.ok) throw new Error("reset failed for " + name + ": HTTP " + r.status);
        }
        const snap = {};
        for (const [p, name] of map) {
          const r = await fetch("http://localhost:" + p + "/sim/snapshot", { headers });
          if (!r.ok) throw new Error("snapshot failed for " + name + ": HTTP " + r.status);
          snap[name] = await r.json();
        }
        await Bun.write("/workspace/traces/snapshot-before.json", JSON.stringify(snap));

  harbor-agent:
    image: oven/bun:1-debian
    working_dir: /workspace
    network_mode: "host"
    environment:
      - SEED_MODE=${SEED_MODE:-realistic}
      - MODALITY_MODE=${MODALITY_MODE:-strict}
      - SIMULATED_TODAY=2026-10-14
      - OTEL_TRACES_PATH=/workspace/traces/trace.json
      - HARBOR_SNAPSHOT_BEFORE=/workspace/traces/snapshot-before.json
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
    volumes:
      - ../../specs:/workspace/specs:ro
      - harbor-traces:/workspace/traces
    depends_on:
      harbor-snapshot-init:
        condition: service_completed_successfully
      ams:
        condition: service_healthy
      rater:
        condition: service_healthy
      crm:
        condition: service_healthy
      ecm:
        condition: service_healthy
      comm:
        condition: service_healthy
      carrier-summit:
        condition: service_healthy
      carrier-coastal:
        condition: service_healthy
      claims:
        condition: service_healthy
    command: ["sleep", "infinity"]

volumes:
  harbor-traces:
