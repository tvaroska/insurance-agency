# Google Cloud Build CI/CD pipeline for Evergreen Insurance Agency
# Executes unit tests across packages/shared, all 8 microservices, eval,
# bidirectional OpenAPI route contracts, repo hygiene, Prisma integration tests,
# showcase preflight, and 20-scenario end-to-end harness validation.

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ------------------------------------------------------------------------- #
  # 1. Install Workspace Dependencies                                         #
  # ------------------------------------------------------------------------- #
  - id: install-deps
    name: oven/bun:1
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bun install --frozen-lockfile
        bun run db:generate

  # ------------------------------------------------------------------------- #
  # 2a. TypeScript Strict Typecheck Across All 12 Project Configs             #
  # ------------------------------------------------------------------------- #
  - id: typecheck
    name: oven/bun:1
    waitFor: ["install-deps"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bun run typecheck

  # ------------------------------------------------------------------------- #
  # 2. Shared Package & Microservice Unit Tests                               #
  # ------------------------------------------------------------------------- #
  - id: unit-tests
    name: oven/bun:1
    waitFor: ["install-deps"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        (cd packages/shared && bun test)
        for svc in ams rater crm ecm comm carrier-summit carrier-coastal claims; do
          echo "=== Running unit tests for services/${svc} ==="
          (cd "services/${svc}" && bun test)
        done

  # ------------------------------------------------------------------------- #
  # 3. Evaluation System, OpenAPI Contracts, Hygiene & Integration Tests      #
  # ------------------------------------------------------------------------- #
  - id: eval-and-contract-tests
    name: oven/bun:1
    waitFor: ["install-deps"]
    env:
      - "CI=true"
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bun install -g @ast-grep/cli
        ast-grep scan --rule specs/ast.rules.yaml
        bun test eval/__tests__/ eval/*/__tests__/
        echo "=== Running tests/*.test.ts (OpenAPI route contract & repo hygiene) ==="
        bun test tests/*.test.ts
        echo "=== Running tests/integration/*.test.ts ==="
        bun test tests/integration/*.test.ts

  # ------------------------------------------------------------------------- #
  # 3b. Python Evaluation & Adapter Unit Tests (Inspect / METR / OpenEnv)     #
  # ------------------------------------------------------------------------- #
  - id: python-tests
    name: oven/bun:1-debian
    waitFor: ["install-deps"]
    env:
      - "PYTHONDONTWRITEBYTECODE=1"
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends python3 python3-venv python3-pip
        python3 -m venv /tmp/evergreen-inspect-venv
        /tmp/evergreen-inspect-venv/bin/pip install -q --no-cache-dir -r eval/inspect/requirements.txt
        /tmp/evergreen-inspect-venv/bin/pytest -p no:cacheprovider eval/inspect/tests

  # ------------------------------------------------------------------------- #
  # 4. End-to-End 20-Scenario Harness & Showcase Preflight Validation         #
  # ------------------------------------------------------------------------- #
  - id: harness-and-showcase-validation
    name: oven/bun:1
    waitFor: ["install-deps"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bun run showcase:check
        bun eval/validate-harness.ts

  # ------------------------------------------------------------------------- #
  # 5. Black-Box Spec Conformance Suite Across All 8 Services                 #
  # ------------------------------------------------------------------------- #
  - id: conformance-tests
    name: oven/bun:1
    waitFor: ["install-deps"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bun test tests/conformance

timeout: "600s"
