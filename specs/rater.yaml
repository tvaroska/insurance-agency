openapi: 3.0.3
info:
  title: Comparative Rater API
  description: |
    The Comparative Rater API enables insurance agencies and brokerages to submit
    risk data and receive real-time premium quotes from multiple carriers
    simultaneously. Producers can compare coverages, bind policies, and query
    carrier appetite — all through a single integration point.

    ## Authentication

    All endpoints require OAuth 2.0 client credentials flow. Obtain tokens from
    `POST /oauth/token` with `client_id=agent-full` and `client_secret=dev-secret`.
    Include the bearer token in the `Authorization` header of every request.

    ## Pagination

    List endpoints use cursor-based pagination. Pass `limit` and `cursor` query
    parameters; the response includes `has_more` and `next_cursor` fields.
  version: 1.4.0
  contact:
    name: Evergreen Rater Engineering

servers:
  - url: http://localhost:3001
    description: Local development

tags:
  - name: Quotes
    description: Submit risk data, poll for carrier premiums, and bind policies.
  - name: Carriers
    description: Query carrier appetite and availability.

security:
  - oauth2: []

paths:
  /quotes/request:
    post:
      operationId: submitQuoteRequest
      summary: Submit a multi-carrier quote request
      description: |
        Accepts client demographics and risk data and fans the request out to all
        eligible carriers. Returns a `request_id` that the caller uses to poll
        `/quotes/{request_id}/results` for live premiums.

        Carrier selection is automatic based on state, policy type, and risk
        profile. To preview which carriers will receive the submission, call
        `GET /carriers/appetite` first.
      tags:
        - Quotes
      security:
        - oauth2:
            - rater:quotes:create

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              personal_auto:
                summary: Personal auto quote for two drivers, one vehicle
                value:
                  policy_type: personal_auto
                  effective_date: "2026-04-01"
                  client:
                    first_name: Margaret
                    last_name: Thornton
                    date_of_birth: "1984-06-15"
                    address:
                      street: "742 Evergreen Terrace"
                      city: Springfield
                      state: IL
                      zip: "62704"
                    email: m.thornton@example.com
                    phone: "+12175551234"
                  drivers:
                    - first_name: Margaret
                      last_name: Thornton
                      date_of_birth: "1984-06-15"
                      license_number: T550-1234-5678
                      license_state: IL
                      gender: female
                      marital_status: married
                      years_licensed: 18
                      violations: []
                    - first_name: David
                      last_name: Thornton
                      date_of_birth: "1982-11-03"
                      license_number: T550-8765-4321
                      license_state: IL
                      gender: male
                      marital_status: married
                      years_licensed: 20
                      violations:
                        - type: speeding
                          date: "2024-09-12"
                          points: 2
                  vehicles:
                    - vin: 1HGCV1F34PA012345
                      year: 2025
                      make: Honda
                      model: Accord
                      trim: EX-L
                      usage: commute
                      annual_miles: 12000
                      ownership: owned
                      garaging_zip: "62704"
                  requested_coverages:
                    - coverage_type: bodily_injury
                      per_person_limit: 250000
                      per_occurrence_limit: 500000
                    - coverage_type: property_damage
                      per_occurrence_limit: 100000
                    - coverage_type: collision
                      deductible: 500
                    - coverage_type: comprehensive
                      deductible: 250
                    - coverage_type: uninsured_motorist
                      per_person_limit: 250000
                      per_occurrence_limit: 500000
      responses:
        '202':
          description: Quote request accepted. Poll for results using the returned request_id.
          headers:
            Location:
              description: URL to poll for results.
              schema:
                type: string
                format: uri
                example: http://localhost:3001/quotes/qr_8f3a9b2c/results

          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - status
                  - created_at
                  - estimated_completion
                properties:
                  request_id:
                    type: string
                    description: Unique identifier for this quote request.
                    example: qr_8f3a9b2c
                  status:
                    $ref: '#/components/schemas/QuoteStatus'
                  created_at:
                    type: string
                    format: date-time
                    example: "2026-03-10T14:32:00Z"
                  estimated_completion:
                    type: string
                    format: date-time
                    description: Estimated time all carrier responses will be received.
                    example: "2026-03-10T14:34:00Z"
                  carriers_queried:
                    type: integer
                    description: Number of carriers the request was sent to.
                    example: 5
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

        '500':
          $ref: '#/components/responses/InternalError'

  /quotes/{request_id}/results:
    get:
      operationId: getQuoteResults
      summary: Poll for carrier quote results
      description: |
        Returns the current state of a previously submitted quote request. The
        `status` field indicates whether all carrier responses have arrived:

        - **pending** — at least one carrier has not yet responded.
        - **partial** — some carriers have responded but others are still pending.
        - **completed** — all carriers have responded (quoted or declined).
        - **expired** — the request is older than 30 days and results are no longer available.

        Poll this endpoint at reasonable intervals (e.g., every 5 seconds) until
        `status` is `completed` or `partial` with an acceptable number of quotes.
      tags:
        - Quotes
      security:
        - oauth2:
            - rater:quotes:read

      parameters:
        - name: request_id
          in: path
          required: true
          description: The quote request identifier returned by `POST /quotes/request`.
          schema:
            type: string
            pattern: '^qr_[a-z0-9]{8}$'
            example: qr_8f3a9b2c
      responses:
        '200':
          description: Quote results retrieved successfully.
          headers:

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResults'
              examples:
                multi_carrier_response:
                  summary: Four carriers with mixed results including a decline
                  value:
                    request_id: qr_8f3a9b2c
                    status: completed
                    policy_type: personal_auto
                    effective_date: "2026-04-01"
                    created_at: "2026-03-10T14:32:00Z"
                    completed_at: "2026-03-10T14:33:47Z"
                    carriers:
                      - carrier_code: PROG
                        carrier_name: Progressive
                        quote_id: qt_a1b2c3d4
                        status: quoted
                        premium_annual: 1842.00
                        premium_monthly: 159.50
                        coverages:
                          - coverage_type: bodily_injury
                            per_person_limit: 250000
                            per_occurrence_limit: 500000
                          - coverage_type: property_damage
                            per_occurrence_limit: 100000
                          - coverage_type: collision
                            deductible: 500
                          - coverage_type: comprehensive
                            deductible: 250
                          - coverage_type: uninsured_motorist
                            per_person_limit: 250000
                            per_occurrence_limit: 500000
                        deductibles:
                          collision: 500
                          comprehensive: 250
                        valid_until: "2026-04-10T23:59:59Z"
                      - carrier_code: TRAV
                        carrier_name: Travelers
                        quote_id: qt_e5f6g7h8
                        status: quoted
                        premium_annual: 2104.00
                        premium_monthly: 181.17
                        coverages:
                          - coverage_type: bodily_injury
                            per_person_limit: 250000
                            per_occurrence_limit: 500000
                          - coverage_type: property_damage
                            per_occurrence_limit: 100000
                          - coverage_type: collision
                            deductible: 500
                          - coverage_type: comprehensive
                            deductible: 250
                          - coverage_type: uninsured_motorist
                            per_person_limit: 250000
                            per_occurrence_limit: 500000
                        deductibles:
                          collision: 500
                          comprehensive: 250
                        valid_until: "2026-04-10T23:59:59Z"
                      - carrier_code: ERIE
                        carrier_name: Erie Insurance
                        quote_id: qt_i9j0k1l2
                        status: quoted
                        premium_annual: 1576.00
                        premium_monthly: 136.33
                        coverages:
                          - coverage_type: bodily_injury
                            per_person_limit: 250000
                            per_occurrence_limit: 500000
                          - coverage_type: property_damage
                            per_occurrence_limit: 100000
                          - coverage_type: collision
                            deductible: 500
                          - coverage_type: comprehensive
                            deductible: 250
                          - coverage_type: uninsured_motorist
                            per_person_limit: 250000
                            per_occurrence_limit: 500000
                        deductibles:
                          collision: 500
                          comprehensive: 250
                        valid_until: "2026-04-10T23:59:59Z"
                      - carrier_code: HRTF
                        carrier_name: The Hartford
                        quote_id: null
                        status: declined
                        premium_annual: null
                        premium_monthly: null
                        coverages: []
                        deductibles: {}
                        decline_reason: "Driver 2 has a moving violation within the last 36 months. Risk does not meet underwriting guidelines for new business."
                        valid_until: null
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

        '500':
          $ref: '#/components/responses/InternalError'

  /quotes/{quote_id}/bind:
    post:
      operationId: bindQuote
      summary: Bind a quoted policy
      description: |
        Finalizes a policy with the selected carrier once the client has approved
        the quoted premium and coverages. The `quote_id` identifies a specific
        carrier's quote from the results array.

        Binding is **idempotent on the quote_id** — if the same quote has already
        been bound, a `409 Conflict` is returned with the existing policy details.

        Upon success the carrier issues a binder and the policy is active as of
        the `effective_date` on the original quote request.
      tags:
        - Quotes
      security:
        - oauth2:
            - rater:quotes:bind

      parameters:
        - name: quote_id
          in: path
          required: true
          description: The carrier-specific quote identifier from the results array.
          schema:
            type: string
            pattern: '^qt_[a-z0-9]{8}$'
            example: qt_a1b2c3d4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindRequest'
            examples:
              bind_progressive:
                summary: Bind the Progressive quote
                value:
                  quote_id: qt_a1b2c3d4
                  payment_method: eft
                  payment_plan: monthly
                  producer_id: prod_9283
                  producer_license_number: IL-1234567
                  insured_signature_collected: true
                  insured_signature_date: "2026-03-12"
                  down_payment_collected: true
                  down_payment_amount: 159.50
      responses:
        '201':
          description: Policy bound successfully.
          headers:

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindResponse'
              examples:
                bound_policy:
                  summary: Successfully bound personal auto policy
                  value:
                    policy_id: POL-PROG-2026-0041827
                    quote_id: qt_a1b2c3d4
                    carrier_code: PROG
                    carrier_name: Progressive
                    effective_date: "2026-04-01"
                    expiration_date: "2027-04-01"
                    premium_annual: 1842.00
                    premium_monthly: 159.50
                    bind_status: bound
                    bound_at: "2026-03-12T10:45:22Z"
                    policy_documents_url: http://localhost:3001/policies/POL-PROG-2026-0041827/documents
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: |
            Conflict — either the quote is already bound/declined, or E&O rules
            have been triggered requiring manager escalation. When E&O rules
            trigger, the response includes an `eo_rules` array describing which
            rules were violated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [CONFLICT, E&O_RULES_TRIGGERED, ESCALATION_NOT_APPROVED, ESCALATION_VERIFICATION_FAILED]
                  message:
                    type: string
                  eo_rules:
                    type: array
                    items:
                      type: object
                      properties:
                        rule:
                          type: string
                          enum: [premium_threshold, state_minimum_violation]
                        message:
                          type: string

        '500':
          $ref: '#/components/responses/InternalError'

  /carriers:
    get:
      operationId: listCarriers
      summary: List carriers (alias for /carriers/appetite)
      description: |
        Alias for `GET /carriers/appetite`. Returns the same paginated list of
        carriers and their appetite for writing specific risk types.
      tags:
        - Carriers
      security:
        - oauth2:
            - rater:carriers:read
      parameters:
        - name: state
          in: query
          description: Two-letter US state code.
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
        - name: policy_type
          in: query
          description: Filter by policy type.
          schema:
            $ref: '#/components/schemas/PolicyType'
        - name: risk_category
          in: query
          schema:
            type: string
            enum: [preferred, standard, non_standard]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Carrier appetite list retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CarrierAppetite'
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /carriers/appetite:
    get:
      operationId: getCarrierAppetite
      summary: Query carrier appetite for specific risks
      description: |
        Returns a paginated list of carriers and their appetite for writing
        specific risk types. Use this endpoint to determine which carriers are
        likely to quote a risk before submitting a full quote request.

        Results can be filtered by state, policy type, and risk category.
      tags:
        - Carriers
      security:
        - oauth2:
            - rater:carriers:read

      parameters:
        - name: state
          in: query
          description: Two-letter US state code to filter carriers licensed and writing in that state.
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
            example: IL
        - name: policy_type
          in: query
          description: Filter carriers by the type of policy they write.
          schema:
            $ref: '#/components/schemas/PolicyType'
        - name: risk_category
          in: query
          description: Filter by risk category (e.g., preferred, standard, non-standard).
          schema:
            type: string
            enum:
              - preferred
              - standard
              - non_standard
        - name: limit
          in: query
          description: Maximum number of carriers to return per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          description: Opaque cursor for pagination. Obtained from `next_cursor` in a previous response.
          schema:
            type: string
            example: eyJjIjoiRVJJRSJ9
      responses:
        '200':
          description: Carrier appetite list retrieved successfully.
          headers:

          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CarrierAppetite'
                  has_more:
                    type: boolean
                    description: Whether additional pages exist beyond this result set.
                    example: true
                  next_cursor:
                    type: string
                    nullable: true
                    description: Cursor value to pass as the `cursor` query parameter to retrieve the next page. Null when `has_more` is false.
                    example: eyJjIjoiTlROVyJ9
                  total_count:
                    type: integer
                    description: Total number of carriers matching the filter criteria.
                    example: 5
              examples:
                illinois_auto:
                  summary: Carriers writing personal auto in Illinois
                  value:
                    data:
                      - carrier_code: PROG
                        carrier_name: Progressive
                        states:
                          - IL
                          - IN
                          - WI
                          - OH
                          - MI
                        policy_types:
                          - personal_auto
                          - homeowners
                          - umbrella
                        risk_categories:
                          - preferred
                          - standard
                          - non_standard
                        appetite_level: high
                        min_driver_age: 16
                        max_vehicles: 8
                        accepts_sr22: true
                      - carrier_code: ERIE
                        carrier_name: Erie Insurance
                        states:
                          - IL
                          - IN
                          - OH
                          - PA
                          - NY
                        policy_types:
                          - personal_auto
                          - homeowners
                          - umbrella
                        risk_categories:
                          - preferred
                          - standard
                        appetite_level: high
                        min_driver_age: 18
                        max_vehicles: 6
                        accepts_sr22: false
                      - carrier_code: TRAV
                        carrier_name: Travelers
                        states:
                          - IL
                          - IN
                          - OH
                          - PA
                          - NY
                          - CT
                          - MA
                        policy_types:
                          - personal_auto
                          - homeowners
                          - umbrella
                          - bop
                          - workers_comp
                          - general_liability
                        risk_categories:
                          - preferred
                          - standard
                        appetite_level: medium
                        min_driver_age: 18
                        max_vehicles: 5
                        accepts_sr22: false
                    has_more: true
                    next_cursor: eyJjIjoiTlROVyJ9
                    total_count: 5
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 client credentials flow for agency and brokerage applications.
      flows:
        clientCredentials:
          tokenUrl: http://localhost:3001/oauth/token
          scopes:
            rater:quotes:create: Submit new quote requests.
            rater:quotes:read: Read quote results and status.
            rater:quotes:bind: Bind a quoted policy.
            rater:carriers:read: Query carrier appetite and availability.

  schemas:
    # ─── Enums ──────────────────────────────────────────────────────────

    PolicyType:
      type: string
      description: The line of business / type of insurance policy.
      enum:
        - personal_auto
        - homeowners
        - umbrella
        - bop
        - workers_comp
        - general_liability
        - professional_liability
        - renters

    CarrierCode:
      type: string
      description: Short mnemonic code identifying a carrier partner.
      enum:
        - TRAV
        - PROG
        - HRTF
        - ERIE
        - NTNW
        - SAFECO
        - LIBT

    QuoteStatus:
      type: string
      description: Aggregate status of a multi-carrier quote request.
      enum:
        - pending
        - completed
        - partial
        - expired

    CarrierQuoteStatus:
      type: string
      description: Status of an individual carrier's response to a quote request.
      enum:
        - quoted
        - declined
        - pending
        - error

    PaymentMethod:
      type: string
      description: Method of premium payment.
      enum:
        - eft
        - credit_card
        - check
        - mortgagee_billed

    PaymentPlan:
      type: string
      description: Premium payment frequency.
      enum:
        - annual
        - semi_annual
        - quarterly
        - monthly

    AppetiteLevel:
      type: string
      description: |
        How actively a carrier seeks this class of business.
        - **high**: carrier is actively marketing and offering competitive rates.
        - **medium**: carrier will write the risk but is selective.
        - **low**: carrier may write the risk under limited circumstances.
      enum:
        - high
        - medium
        - low

    # ─── Core domain objects ────────────────────────────────────────────

    Address:
      type: object
      required:
        - street
        - city
        - state
        - zip
      properties:
        street:
          type: string
          description: Street address including unit/apt if applicable.
          maxLength: 200
          example: "742 Evergreen Terrace"
        street2:
          type: string
          description: Additional address line.
          maxLength: 200
        city:
          type: string
          maxLength: 100
          example: Springfield
        state:
          type: string
          description: Two-letter US state code.
          pattern: '^[A-Z]{2}$'
          example: IL
        zip:
          type: string
          description: Five-digit or ZIP+4 postal code.
          pattern: '^\d{5}(-\d{4})?$'
          example: "62704"

    Client:
      type: object
      required:
        - first_name
        - last_name
        - date_of_birth
        - address
      properties:
        first_name:
          type: string
          description: Client's legal first name.
          maxLength: 100
          example: Margaret
        last_name:
          type: string
          description: Client's legal last name.
          maxLength: 100
          example: Thornton
        date_of_birth:
          type: string
          format: date
          description: Client's date of birth (YYYY-MM-DD).
          example: "1984-06-15"
        address:
          $ref: '#/components/schemas/Address'
        email:
          type: string
          format: email
          description: Client's email address.
          example: m.thornton@example.com
        phone:
          type: string
          description: Client's phone number in E.164 format.
          pattern: '^\+1\d{10}$'
          example: "+12175551234"

    Violation:
      type: object
      required:
        - type
        - date
      properties:
        type:
          type: string
          description: Type of driving violation.
          enum:
            - speeding
            - at_fault_accident
            - not_at_fault_accident
            - dui
            - reckless_driving
            - failure_to_stop
            - other
          example: speeding
        date:
          type: string
          format: date
          description: Date of the violation.
          example: "2024-09-12"
        points:
          type: integer
          description: License points assessed.
          minimum: 0
          example: 2
        description:
          type: string
          description: Free-text description of the violation if type is other.

    Driver:
      type: object
      required:
        - first_name
        - last_name
        - date_of_birth
        - license_number
        - license_state
      properties:
        first_name:
          type: string
          maxLength: 100
          example: Margaret
        last_name:
          type: string
          maxLength: 100
          example: Thornton
        date_of_birth:
          type: string
          format: date
          example: "1984-06-15"
        license_number:
          type: string
          description: Driver's license number.
          maxLength: 30
          example: T550-1234-5678
        license_state:
          type: string
          pattern: '^[A-Z]{2}$'
          example: IL
        gender:
          type: string
          enum:
            - male
            - female
            - non_binary
            - not_specified
        marital_status:
          type: string
          enum:
            - single
            - married
            - divorced
            - widowed
            - domestic_partner
        years_licensed:
          type: integer
          description: Number of full years the driver has been licensed.
          minimum: 0
          example: 18
        violations:
          type: array
          description: Driving violations in the last 5 years.
          items:
            $ref: '#/components/schemas/Violation'

    Vehicle:
      type: object
      required:
        - vin
        - year
        - make
        - model
        - usage
      properties:
        vin:
          type: string
          description: 17-character Vehicle Identification Number.
          pattern: '^[A-HJ-NPR-Z0-9]{17}$'
          example: 1HGCV1F34PA012345
        year:
          type: integer
          description: Model year.
          minimum: 1980
          maximum: 2027
          example: 2025
        make:
          type: string
          maxLength: 50
          example: Honda
        model:
          type: string
          maxLength: 50
          example: Accord
        trim:
          type: string
          maxLength: 50
          example: EX-L
        usage:
          type: string
          description: Primary use of the vehicle.
          enum:
            - commute
            - pleasure
            - business
            - rideshare
        annual_miles:
          type: integer
          description: Estimated annual mileage.
          minimum: 0
          example: 12000
        ownership:
          type: string
          description: Ownership status of the vehicle.
          enum:
            - owned
            - financed
            - leased
        garaging_zip:
          type: string
          description: ZIP code where the vehicle is primarily garaged.
          pattern: '^\d{5}$'
          example: "62704"

    PropertyInfo:
      type: object
      description: Property details for homeowners and dwelling policies.
      required:
        - address
        - year_built
        - square_footage
        - construction_type
        - roof_type
      properties:
        address:
          $ref: '#/components/schemas/Address'
        year_built:
          type: integer
          minimum: 1800
          example: 1998
        square_footage:
          type: integer
          minimum: 100
          example: 2400
        construction_type:
          type: string
          enum:
            - frame
            - masonry
            - masonry_veneer
            - superior
        roof_type:
          type: string
          enum:
            - asphalt_shingle
            - tile
            - metal
            - slate
            - wood_shake
        roof_year:
          type: integer
          description: Year the roof was last replaced.
          example: 2018
        dwelling_coverage:
          type: number
          format: double
          description: Replacement cost value of the dwelling.
          example: 375000.00
        heating_type:
          type: string
          enum:
            - forced_air
            - radiant
            - heat_pump
            - baseboard

    Coverage:
      type: object
      required:
        - coverage_type
      properties:
        coverage_type:
          type: string
          description: Identifier for the type of coverage.
          example: bodily_injury
        per_person_limit:
          type: number
          format: double
          description: Per-person coverage limit in USD.
          example: 250000
        per_occurrence_limit:
          type: number
          format: double
          description: Per-occurrence coverage limit in USD.
          example: 500000
        aggregate_limit:
          type: number
          format: double
          description: Aggregate policy limit in USD.
        deductible:
          type: number
          format: double
          description: Deductible amount in USD.
          example: 500

    # ─── Request / Response schemas ─────────────────────────────────────

    QuoteRequest:
      type: object
      required:
        - policy_type
        - effective_date
        - client
        - requested_coverages
      properties:
        policy_type:
          $ref: '#/components/schemas/PolicyType'
        effective_date:
          type: string
          format: date
          description: Desired policy effective date (YYYY-MM-DD). Must be between today and 60 days in the future.
          example: "2026-04-01"
        client:
          $ref: '#/components/schemas/Client'
        drivers:
          type: array
          description: Required for personal_auto policies. List of all drivers in the household.
          items:
            $ref: '#/components/schemas/Driver'
          minItems: 1
          maxItems: 10
        vehicles:
          type: array
          description: Required for personal_auto policies.
          items:
            $ref: '#/components/schemas/Vehicle'
          minItems: 1
          maxItems: 10
        property:
          $ref: '#/components/schemas/PropertyInfo'
        requested_coverages:
          type: array
          description: Coverage types and limits the client is requesting.
          items:
            $ref: '#/components/schemas/Coverage'
          minItems: 1
        prior_carrier:
          type: string
          description: Name or code of the client's current/prior carrier, if any.
          example: GEICO
        years_with_prior_carrier:
          type: integer
          description: Number of years insured with the prior carrier.
          minimum: 0
          example: 4
        prior_policy_expiration:
          type: string
          format: date
          description: Expiration date of current policy, if any.
        lapse_in_coverage:
          type: boolean
          description: Whether there has been any lapse in insurance coverage.
          default: false

    QuoteResults:
      type: object
      required:
        - request_id
        - status
        - policy_type
        - effective_date
        - created_at
        - carriers
      properties:
        request_id:
          type: string
          description: Unique identifier for the quote request.
          example: qr_8f3a9b2c
        status:
          $ref: '#/components/schemas/QuoteStatus'
        policy_type:
          $ref: '#/components/schemas/PolicyType'
        effective_date:
          type: string
          format: date
          example: "2026-04-01"
        created_at:
          type: string
          format: date-time
          example: "2026-03-10T14:32:00Z"
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when all carrier responses were received. Null while status is pending.
          example: "2026-03-10T14:33:47Z"
        carriers:
          type: array
          description: Individual carrier quote responses.
          items:
            $ref: '#/components/schemas/CarrierQuote'

    CarrierQuote:
      type: object
      required:
        - carrier_code
        - carrier_name
        - status
      properties:
        carrier_code:
          $ref: '#/components/schemas/CarrierCode'
        carrier_name:
          type: string
          description: Human-readable carrier name.
          example: Progressive
        quote_id:
          type: string
          nullable: true
          description: Unique identifier for this carrier's quote. Null if the carrier declined.
          example: qt_a1b2c3d4
        status:
          $ref: '#/components/schemas/CarrierQuoteStatus'
        premium_annual:
          type: number
          format: double
          nullable: true
          description: Total annual premium in USD. Null if the carrier declined or is pending.
          example: 1842.00
        premium_monthly:
          type: number
          format: double
          nullable: true
          description: Monthly installment amount in USD (may include installment fee). Null if the carrier declined or is pending.
          example: 159.50
        coverages:
          type: array
          description: Coverage details offered by the carrier. Empty array if declined.
          items:
            $ref: '#/components/schemas/Coverage'
        deductibles:
          type: object
          description: Map of coverage type to deductible amount in USD.
          additionalProperties:
            type: number
            format: double
          example:
            collision: 500
            comprehensive: 250
        decline_reason:
          type: string
          nullable: true
          description: Human-readable explanation when the carrier declines the risk. Null if quoted.
        valid_until:
          type: string
          format: date-time
          nullable: true
          description: Timestamp after which this quote expires and can no longer be bound. Null if declined.
          example: "2026-04-10T23:59:59Z"

    BindRequest:
      type: object
      required:
        - quote_id
        - payment_method
        - producer_id
        - insured_signature_collected
        - insured_signature_date
      properties:
        quote_id:
          type: string
          description: The carrier-specific quote_id from the results array.
          pattern: '^qt_[a-z0-9]{8}$'
          example: qt_a1b2c3d4
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        payment_plan:
          $ref: '#/components/schemas/PaymentPlan'
        producer_id:
          type: string
          description: Identifier of the producing agent or broker.
          example: prod_9283
        producer_license_number:
          type: string
          description: State insurance license number of the producer.
          example: IL-1234567
        insured_signature_collected:
          type: boolean
          description: Confirmation that the insured's signature has been obtained.
        insured_signature_date:
          type: string
          format: date
          description: Date the insured signed the application.
          example: "2026-03-12"
        down_payment_collected:
          type: boolean
          description: Whether the initial down payment has been collected.
          default: false
        down_payment_amount:
          type: number
          format: double
          description: Amount of the down payment collected in USD.
          example: 159.50
        escalation_id:
          type: string
          nullable: true
          description: |
            Optional escalation ID from AMS. Required when E&O rules trigger
            (premium > $10K or below state minimum coverage). The escalation
            must have status `approved` for binding to proceed.
          example: esc_a1b2c3d4

    BindResponse:
      type: object
      required:
        - policy_id
        - quote_id
        - carrier_code
        - effective_date
        - premium_annual
        - bind_status
        - bound_at
      properties:
        policy_id:
          type: string
          description: Carrier-assigned policy number.
          example: POL-PROG-2026-0041827
        quote_id:
          type: string
          description: The quote that was bound.
          example: qt_a1b2c3d4
        carrier_code:
          $ref: '#/components/schemas/CarrierCode'
        carrier_name:
          type: string
          example: Progressive
        effective_date:
          type: string
          format: date
          description: Policy effective date.
          example: "2026-04-01"
        expiration_date:
          type: string
          format: date
          description: Policy expiration date.
          example: "2027-04-01"
        premium_annual:
          type: number
          format: double
          description: Annual premium in USD.
          example: 1842.00
        premium_monthly:
          type: number
          format: double
          description: Monthly premium in USD.
          example: 159.50
        bind_status:
          type: string
          description: Status of the bind operation.
          enum:
            - bound
            - pending_carrier_confirmation
          example: bound
        bound_at:
          type: string
          format: date-time
          description: Timestamp when the policy was bound.
          example: "2026-03-12T10:45:22Z"
        policy_documents_url:
          type: string
          format: uri
          description: URL to retrieve policy documents (dec page, ID cards, etc.).
          example: http://localhost:3001/policies/POL-PROG-2026-0041827/documents

    CarrierAppetite:
      type: object
      required:
        - carrier_code
        - carrier_name
        - states
        - policy_types
        - risk_categories
        - appetite_level
      properties:
        carrier_code:
          $ref: '#/components/schemas/CarrierCode'
        carrier_name:
          type: string
          description: Human-readable carrier name.
          example: Progressive
        states:
          type: array
          description: US states where this carrier is licensed and actively writing.
          items:
            type: string
            pattern: '^[A-Z]{2}$'
          minItems: 1
          example:
            - IL
            - IN
            - WI
            - OH
            - MI
        policy_types:
          type: array
          description: Lines of business the carrier writes.
          items:
            $ref: '#/components/schemas/PolicyType'
          minItems: 1
        risk_categories:
          type: array
          description: Risk tiers the carrier is willing to underwrite.
          items:
            type: string
            enum:
              - preferred
              - standard
              - non_standard
          minItems: 1
        appetite_level:
          $ref: '#/components/schemas/AppetiteLevel'
        min_driver_age:
          type: integer
          description: Minimum driver age the carrier will consider.
          example: 16
        max_vehicles:
          type: integer
          description: Maximum number of vehicles on a single policy.
          example: 8
        accepts_sr22:
          type: boolean
          description: Whether the carrier files SR-22 certificates.
          example: true

    # ─── Error schemas ──────────────────────────────────────────────────

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code.
              example: validation_error
            message:
              type: string
              description: Human-readable error summary.
              example: The request body contains invalid fields.
            correlation_id:
              type: string
              format: uuid
              description: Unique identifier for this error occurrence. Always present on 5xx errors. Include this when contacting support.
              example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            details:
              type: array
              description: Field-level validation errors. Present only on 400 responses.
              items:
                $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: JSON path to the invalid field.
          example: client.date_of_birth
        message:
          type: string
          description: Human-readable description of the validation failure.
          example: Must be a valid date in the past.
        code:
          type: string
          description: Machine-readable validation rule that failed.
          example: date_in_past

  responses:
    ValidationError:
      description: The request body or parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_error
              message: The request body contains invalid fields.
              details:
                - field: effective_date
                  message: Effective date must be between today and 60 days in the future.
                  code: date_range
                - field: drivers[1].license_number
                  message: License number is required for all drivers.
                  code: required

    AuthError:
      description: Authentication failed. The access token is missing, expired, or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: authentication_error
              message: The access token has expired. Please obtain a new token.

    ForbiddenError:
      description: The authenticated client lacks the required scope for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden
              message: "The token does not have the required scope: rater:quotes:bind."

    NotFoundError:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: "Quote request qr_00000000 was not found."

    ConflictError:
      description: The quote has already been bound. The existing policy details are returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: conflict
              message: "Quote qt_a1b2c3d4 has already been bound as policy POL-PROG-2026-0041827."

    InternalError:
      description: An unexpected server error occurred. Include the correlation_id when contacting support.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: An unexpected error occurred. Please try again later.
              correlation_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
