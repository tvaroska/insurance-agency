  # -----------------------------------------------------------------------
  # POST /envelopes/create
  # -----------------------------------------------------------------------
  /envelopes/create:
    post:
      operationId: createEnvelope
      summary: Create a signature envelope
      description: |
        Generate a DocuSign-style e-signature request for one or more
        documents.  Each signer receives an email notification with a secure
        link.  The envelope expires after 30 days by default.
      tags:
        - Envelopes
      security:
        - oauth2:
            - ecm:envelopes:create

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvelopeCreateRequest"
            example:
              client_id: "b2f7c8a1-49d3-4e6a-8c15-7a3d9e2b1f04"
              document_ids:
                - "d4e5f6a7-1234-5678-9abc-def012345678"
              signers:
                - name: "Amara Osei"
                  email: "amara.osei@example.com"
                  role: "policyholder"
                - name: "David Chen"
                  email: "david.chen@evergreen-ins.com"
                  role: "agent"
              message: "Please review and sign your homeowners policy application. Contact your agent with questions."
              redirect_url: "http://localhost:3003/signing-complete"
      responses:
        "201":
          description: Envelope created and notifications queued.
          headers:
            Location:
              description: URL of the newly created envelope resource.
              schema:
                type: string
                format: uri
              example: "http://localhost:3003/envelopes/e9f8d7c6-b5a4-3210-fedc-ba9876543210"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                envelope_id: "e9f8d7c6-b5a4-3210-fedc-ba9876543210"
                client_id: "b2f7c8a1-49d3-4e6a-8c15-7a3d9e2b1f04"
                document_ids:
                  - "d4e5f6a7-1234-5678-9abc-def012345678"
                signers:
                  - name: "Amara Osei"
                    email: "amara.osei@example.com"
                    role: "policyholder"
                    status: "pending"
                    signed_at: null
                  - name: "David Chen"
                    email: "david.chen@evergreen-ins.com"
                    role: "agent"
                    status: "pending"
                    signed_at: null
                status: "created"
                created_at: "2025-06-15T14:35:00Z"
                completed_at: null
                expiration_date: "2025-07-15T23:59:59Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

        "500":
          $ref: "#/components/responses/InternalServerError"

