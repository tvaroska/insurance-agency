  # -----------------------------------------------------------------------
  # GET /documents/acord/{form_type}
  # -----------------------------------------------------------------------
  /documents/acord/{form_type}:
    get:
      operationId: generateAcordForm
      summary: Generate an ACORD-style PDF form
      description: |
        Generates a PDF in the style of the specified ACORD form, populated
        with data fetched from the AMS and Claims services.

        - **ACORD 90** (Personal Auto Application): requires `policy_id` for a `personal_auto` policy
        - **ACORD 80** (Homeowners Application): requires `policy_id` for a `homeowners` policy
        - **ACORD 35** (Loss Notice): requires `claim_id`
      tags:
        - ACORD Forms
      security:
        - oauth2:
            - ecm:acord:read

      parameters:
        - name: form_type
          in: path
          required: true
          description: The ACORD form number to generate.
          schema:
            $ref: "#/components/schemas/AcordFormType"
        - name: policy_id
          in: query
          required: false
          description: Policy ID from the AMS service. Required for forms 90 and 80.
          schema:
            type: string
            example: "POL-PA-2025-001847"
        - name: claim_id
          in: query
          required: false
          description: Claim ID from the Claims service. Required for form 35.
          schema:
            type: string
            example: "CLM-2025-000001"
      responses:
        "200":
          description: PDF generated successfully.
          headers:
            Content-Disposition:
              description: Suggested filename for the generated PDF.
              schema:
                type: string
              example: 'inline; filename="ACORD-90.pdf"'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
